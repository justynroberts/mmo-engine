# Coolify deployment (Docker Compose build pack): the web gateway behind the platform's proxy and the game's UDP port
# published on the host. The admin console stays on the container's loopback and is never exposed. The local setup
# is docker-compose.yml at the root (host networking).
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Behind the proxy: the web port on 7790 serves only the data the Godot client fetches (no browser play page or
      # WebSocket relay), and takes the real address from X-Forwarded-For.
      - MMO_ARGS=--web 0.0.0.0:7790 --web-trust-proxy --no-browser --workers 2
      # Which world (deploy/entrypoint.sh): Hibernia at 65,536 units, made from its recipe on first start (about five
      # minutes, 800 MB). Changing it moves the old world aside and starts the new one fresh; characters are kept.
      - MMO_SEED=hibernia-65536
    expose:
      - "7790"
    ports:
      - "7777:7777/udp"
    volumes:
      - mmo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7790/play/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long enough for the first start of a new world, while worldgen makes it.
      start_period: 900s
    restart: unless-stopped
volumes:
  mmo-data:
