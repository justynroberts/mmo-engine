[package]
name = "server"
edition.workspace = true
version.workspace = true

[dependencies]
proto = { path = "../proto" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tungstenite = "0.24"
blake3 = "1"
flate2 = "1"

[dev-dependencies]
mmo-client = { path = "../client-ffi" }
